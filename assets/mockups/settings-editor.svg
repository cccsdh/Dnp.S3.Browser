<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <style>
    .bg { fill: #FFFFFF; }
    .panel { fill: #FAFAFA; stroke: #E0E0E0; stroke-width: 1; rx:8; ry:8 }
    .title { fill: #222222; font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700 }
    .label { fill: #222222; font-family: Arial, Helvetica, sans-serif; font-size:13px }
    .input { fill: #FFFFFF; stroke: #E0E0E0; stroke-width:1; rx:6; ry:6 }
    .hint { fill: #555555; font-family: Arial, Helvetica, sans-serif; font-size:12px }
    .button { fill: #0078D4; rx:6; ry:6 }
    .button-text { fill: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size:13px }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="380" />
  <rect class="panel" x="40" y="20" width="720" height="340" />

  <text class="title" x="64" y="54">Settings — Account Editor</text>

  <!-- Labels and inputs -->
  <text class="label" x="64" y="92">Name:</text>
  <rect class="input" x="200" y="78" width="520" height="30" />
  <text class="hint" x="208" y="98">Account name (unique)</text>

  <text class="label" x="64" y="140">Use Local S3:</text>
  <rect x="200" y="126" width="22" height="22" rx="4" ry="4" fill="#FFFFFF" stroke="#E0E0E0" />

  <text class="label" x="64" y="188">Access Key:</text>
  <rect class="input" x="200" y="174" width="520" height="30" />
  <text class="hint" x="208" y="194">AWS Access Key</text>

  <text class="label" x="64" y="236">Secret Key:</text>
  <rect class="input" x="200" y="222" width="520" height="30" />
  <text class="hint" x="208" y="242">•••••••••••••••</text>

  <text class="label" x="64" y="284">MFA ARN:</text>
  <rect class="input" x="200" y="270" width="520" height="30" />
  <text class="hint" x="208" y="290">arn:aws:iam::123456789012:mfa/device</text>

  <text class="label" x="64" y="332">Region:</text>
  <rect class="input" x="200" y="318" width="200" height="30" />
  <text class="hint" x="208" y="338">us-east-1</text>

  <!-- Buttons -->
  <rect class="button" x="520" y="318" width="90" height="30" />
  <text class="button-text" x="542" y="338">Save</text>
  <rect x="620" y="318" width="90" height="30" rx="6" ry="6" fill="#F3F3F3" stroke="#E0E0E0" />
  <text x="642" y="338" fill="#222222" font-family="Arial" font-size="13">Cancel</text>

</svg>
